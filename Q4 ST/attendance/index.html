<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <!-- Python Packages -->
    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>

    <style>
        body {
            background-color: #1f1f1f;
            color: white;
        }

        .card-custom {
            background-color: #2b2b2b;
            border: 2px solid #dc3545;
            border-radius: 15px;
        }

        .title-text {
            color: #ffc107;
            text-shadow: 2px 2px black;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">💥 Ruby Force</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="../index.html">Home</a>
            <a class="nav-link text-white" href="../bros/index.html">Bros</a>
            <a class="nav-link text-white" href="../photos/index.html">Photos</a>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center mt-5">

    <div class="card card-custom shadow-lg p-4" style="width: 450px;">

        <h3 class="text-center title-text mb-4">
            📊 Attendance Tracker
        </h3>

        <form>

            <!-- Day Selection -->
            <div class="mb-3">
                <label class="form-label fw-bold">Select Day</label>

                <select id="dayOfTheWeek" class="form-select">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
            </div>

            <!-- Absence Input -->
            <div class="mb-3">
                <label class="form-label fw-bold">Absences</label>

                <input type="number" id="absences" class="form-control" placeholder="Enter absences">
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <input type="button" py-click="displaying" value="Submit" class="btn btn-danger">
            </div>

        </form>

        <!-- Output Area -->
        <div id="output" class="mt-3 text-center"></div>

    </div>

</div>

<!-- Python File -->
<py-script src="main.py"></py-script>

</body>
</html>
