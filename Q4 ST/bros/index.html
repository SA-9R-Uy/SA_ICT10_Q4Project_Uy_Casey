<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bros</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
</head>

<body class="bg-dark text-white">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">💥 Ruby Force</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="../index.html">Home</a>
            <a class="nav-link text-white" href="../attendance/index.html">Attendance</a>
            <a class="nav-link text-white" href="../photos/index.html">Photos</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h2 class="fw-bold text-warning">📘 Grade 10 Bros System</h2>
        <p class="text-light">Add and view classmates easily</p>
    </div>

    <!-- Input Card -->
    <div class="card bg-secondary shadow p-4">

        <!-- Name Input -->
        <div class="mb-3">
            <input type="text" id="name" class="form-control" placeholder="Enter classmate name">
        </div>

        <!-- Section Input -->
        <div class="mb-3">
            <input type="text" id="section" class="form-control" placeholder="Enter section">
        </div>

        <!-- Subject Input -->
        <div class="mb-3">
            <input type="text" id="subject" class="form-control" placeholder="Enter favorite subject">
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button py-click="add_classmate" class="btn btn-danger w-50">Add</button>
            <button py-click="show_classmates" class="btn btn-warning w-50">Show</button>
        </div>

    </div>

    <!-- Output Area -->
    <div class="card bg-dark border border-warning shadow mt-4 p-3">
        <h5 class="fw-bold text-warning">📋 Classmate List</h5>
        <div id="output" class="mt-2"></div>
    </div>

</div>

<!-- Python File -->
<py-script src="main.py"></py-script>

</body>
</html>
